<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Media IPTV Player</title>
    <style>
        /* MODERN, SEKME DESTEKLİ VE KIRILMAZ IPTV PLAYER TASARIMI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 22px;
            color: #3b82f6;
            font-weight: 700;
        }

        /* Sekme Sistemi (Tab Menü) Tasarımı */
        .tabs-nav {
            display: flex;
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 8px;
            overflow: hidden;
            padding: 4px;
            gap: 4px;
        }

        .tab-link {
            flex: 1;
            background: none;
            border: none;
            color: #94a3b8;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin-top: 0;
        }

        .tab-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tab-link.active {
            color: #fff;
            background-color: #2563eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .tab-content {
            display: none;
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .tab-content.active {
            display: block;
        }

        .input-item {
            margin-bottom: 10px;
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            background-color: #090d16;
            border: 1px solid #334155;
            color: #fff;
            padding: 11px;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: white;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        .btn-submit { background-color: #2563eb; }
        .btn-submit:hover { background-color: #1d4ed8; }

        /* Durum Bildirim Paneli */
        .status-badge {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: block;
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Oynatıcı Alanı */
        .panel-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 1024px) {
            .panel-layout { grid-template-columns: 1.8fr 1.2fr; }
        }

        .media-box {
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #243552;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .media-title {
            background-color: #151f32;
            padding: 12px;
            font-size: 14px;
            border-top: 1px solid #243552;
        }

        /* Sağ Kanal Listesi */
        .sidebar {
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 10px;
            padding: 15px;
            height: 450px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .sidebar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge-info {
            background-color: #243552;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .row-channel {
            width: 100%;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .row-channel:hover {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #fff;
        }

        .row-channel.selected {
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
            border-color: #60a5fa;
        }

        .blank-text {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚗 Auto Media IPTV Player</h1>
        </header>

        <!-- SEKME SEÇİM MENÜSÜ -->
        <div class="tabs-nav">
            <button class="tab-link active" onclick="switchTab(event, 'm3u-tab')">🔗 M3U Link Girişi</button>
            <button class="tab-link" onclick="switchTab(event, 'xtream-tab')">🔐 Xtream API Girişi</button>
        </div>

        <!-- M3U SEKME İÇERİĞİ -->
        <div id="m3u-tab" class="tab-content active">
            <div class="input-item">
                <label>M3U / M3U8 Bağlantı Adresi</label>
                <input type="text" id="m3uUrlBox" placeholder="https://site.com">
            </div>
            <button class="btn-submit" onclick="startM3ULoad()">Kanalları Yükle</button>
        </div>

        <!-- XTREAM API SEKME İÇERİĞİ -->
        <div id="xtream-tab" class="tab-content">
            <div class="input-item">
                <label>Sunucu Adresi (Host URL)</label>
                <input type="text" id="xtreamHostBox" placeholder="http://sunucuadresi.com:8080">
            </div>
            <div class="row-inputs">
                <div class="input-item">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="xtreamUserBox" placeholder="Username">
                </div>
                <div class="input-item">
                    <label>Şifre</label>
                    <input type="password" id="xtreamPassBox" placeholder="Password">
                </div>
            </div>
            <button class="btn-submit" onclick="startXtreamLoad()">Giriş Yap ve Yükle</button>
        </div>

        <!-- ORTAK DURUM BİLDİRİM ŞERİDİ -->
        <div id="statusAlert" class="status-badge">Sistem Hazır. Bilgilerinizi girip butona basın.</div>

        <!-- VİDEO VE LİSTE PANELİ -->
        <div class="panel-layout">
            <div class="media-box">
                <video id="carVideoView" controls autoplay></video>
                <div class="media-title" id="lblPlaying">
                    Kanal: <span style="color: #60a5fa;">Seçilmedi</span>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-top">
                    <h3>Kanallar</h3>
                    <span class="badge-info" id="lblTotal">0 Kanal</span>
                </div>
                <input type="text" id="txtSearch" oninput="runSearch()" placeholder="Kanal ismi ara...">
                <div class="channels-list" id="domChannelList">
                    <div class="blank-text">Kanallar burada listelenecek.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var loadedChannels = [];
        var mainVideo = document.getElementById('carVideoView');

        // Sekme Değiştirme Mekanizması
        function switchTab(evt, tabId) {
            var contents = document.getElementsByClassName("tab-content");
            for (var i = 0; i < contents.length; i++) {
                contents[i].classList.remove("active");
            }
            var links = document.getElementsByClassName("tab-link");
            for (var i = 0; i < links.length; i++) {
