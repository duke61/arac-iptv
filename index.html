<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Media IPTV Player</title>
    <style>
        /* ARACIN EKRANINA UYGUN, DOKUNMATİK DOSTU TASARIM */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 20px;
            color: #3b82f6;
            font-weight: 700;
        }

        /* Giriş Kartları */
        .grid-forms {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .grid-forms { grid-template-columns: 1fr 1fr; }
        }

        .config-card {
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 8px;
            padding: 15px;
        }

        .config-card h2 {
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .m3u-color { color: #3b82f6; }
        .xtream-color { color: #10b981; }

        .input-item {
            margin-bottom: 8px;
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        label {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background-color: #090d16;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            color: white;
        }

        .action-blue { background-color: #2563eb; }
        .action-green { background-color: #059669; }

        /* Canlı Durum Bildirimi */
        .status-badge {
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            display: none;
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }

        /* Oynatıcı ve Liste Alanı */
        .panel-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 1024px) {
            .panel-layout { grid-template-columns: 1.8fr 1.2fr; }
        }

        .media-box {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #243552;
            display: flex;
            flex-direction: column;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .media-title {
            background-color: #151f32;
            padding: 12px;
            font-size: 13px;
            border-top: 1px solid #243552;
            font-weight: 500;
        }

        /* Araç İçi Kolay Kaydırılabilir Kanal Listesi */
        .channels-sidebar {
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 8px;
            padding: 12px;
            height: 420px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge-info {
            background-color: #243552;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            color: #cbd5e1;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
        }

        .row-channel {
            width: 100%;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            padding: 12px; /* Dokunması kolay olması için genişletildi */
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-channel:active, .row-channel:hover {
            background-color: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            color: #fff;
        }

        .row-channel.selected {
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
        }

        .blank-text {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚗 Auto Media IPTV Player</h1>
        </header>

        <!-- Giriş Panelleri -->
        <div class="grid-forms">
            <div class="config-card">
                <h2 class="m3u-color">🔗 M3U Playlist Girişi</h2>
                <div class="input-item">
                    <label>M3U URL</label>
                    <input type="text" id="m3uUrlBox" placeholder="https://site.com">
                </div>
                <button class="action-blue" onclick="startM3ULoad()">Kanalları Yükle</button>
            </div>

            <div class="config-card">
                <h2 class="xtream-color">🔐 Xtream API Hızlı Giriş</h2>
                <div class="input-item">
                    <label>Sunucu Adresi (Host)</label>
                    <input type="text" id="xtreamHostBox" placeholder="http://sunucuadresi.com:8080">
                </div>
                <div class="row-inputs">
                    <div class="input-item">
                        <label>Kullanıcı</label>
                        <input type="text" id="xtreamUserBox" placeholder="Username">
                    </div>
                    <div class="input-item">
                        <label>Şifre</label>
                        <input type="password" id="xtreamPassBox" placeholder="Password">
                    </div>
                </div>
                <button class="action-green" onclick="startXtreamLoad()">Yükle</button>
            </div>
        </div>

        <div id="statusAlert" class="status-badge"></div>

        <!-- Oynatıcı Alanları -->
        <div class="panel-layout">
            <div class="media-box">
                <video id="carVideoView" controls autoplay playsinline></video>
                <div class="media-title" id="lblPlaying">
                    Kanal: <span style="color: #60a5fa;">Seçilmedi</span>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-top">
                    <h3>Kanallar</h3>
                    <span class="badge-info" id="lblTotal">0 Kanal</span>
                </div>
                <input type="text" id="txtSearch" oninput="runSearch()" placeholder="Kanal ismi ara...">
                <div class="channels-list" id="domChannelList">
                    <div class="blank-text">Listenizi yüklediğinizde kanallar burada listelenir.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let loadedChannels = [];
        const mainVideo = document.getElementById('carVideoView');

        function printStatus(msg, mode) {
            const el = document.getElementById('statusAlert');
            el.innerText = msg;
            el.style.display = 'block';
            if (mode === 'err') {
                el.style.borderColor = '#ef4444';
                el.style.color = '#fca5a5';
                el.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            } else if (mode === 'ok') {
                el.style.borderColor = '#10b981';
                el.style.color = '#a7f3d0';
                el.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
            } else {
                el.style.borderColor = '#3b82f6';
                el.style.color = '#93c5fd';
                el.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
            }
        }

        async function startM3ULoad() {
            const rawUrl = document.getElementById('m3uUrlBox').value.trim();
            if (!rawUrl) return alert('Lütfen linkinizi yazın.');

            printStatus('Bağlantı tüneli kuruluyor (Yöntem 1)...', 'wait');

            // Çözüm Havuzu 1: Tarayıcı engelini aşan güvenli tünel
            try {
                const gateway1 = 'https://corsproxy.io?' + encodeURIComponent(rawUrl);
                const resp = await fetch(gateway1);
                const txt = await resp.text();
