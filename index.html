<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Web IPTV Player</title>
    
    <!-- Modern Google Fontları -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Video.js Modern Oynatıcı Kurulumu -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Giriş Panelleri */
        .login-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .login-grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid #2e3e56;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid #475569;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
            margin-top: 5px;
        }

        .btn-blue { background-color: var(--accent-blue); }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-green { background-color: var(--accent-green); }
        .btn-green:hover { background-color: #059669; }

        /* Bildirim Çubuğu */
        .status-bar {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            border: 1px solid transparent;
        }
        .status-info { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border-color: rgba(59, 130, 246, 0.3); }
        .status-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

        /* Ana Oynatıcı Alanı */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .main-grid { grid-template-columns: 2fr 1fr; }
        }

        .player-wrapper {
            background-color: black;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #2e3e56;
        }

        .video-js {
            width: 100% !important;
            height: 480px !important;
        }

        @media (max-width: 768px) {
            .video-js { height: 260px !important; }
        }

        .track-info {
            background-color: var(--bg-card);
            padding: 15px;
            font-size: 0.95rem;
            border-top: 1px solid #2e3e56;
            font-weight: 500;
        }

        /* Sağ Liste Alanı */
        .list-wrapper {
            background-color: var(--bg-card);
            border: 1px solid #2e3e56;
            border-radius: 12px;
            padding: 16px;
            height: 540px;
            display: flex;
            flex-direction: column;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background-color: var(--bg-input);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .search-box {
            margin-bottom: 12px;
        }

        .channel-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 4px;
        }

        .channel-item {
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            padding: 10px 14px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }

        .channel-item:hover {
            background: rgba(5b, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #fff;
            transform: translateX(2px);
        }

        .channel-item.active {
            background: var(--accent-blue);
            color: white;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📺 Premium Web IPTV Player</h1>
            <p>Listenizi girin ve donmadan web tarayıcınızdan izleyin</p>
        </header>

        <!-- Giriş Bölümleri -->
        <div class="login-grid">
            <!-- M3U Form -->
            <div class="card">
                <h2 style="color: var(--accent-blue);">🔗 M3U Playlist</h2>
                <div class="form-group">
                    <label>M3U / M3U8 Bağlantı Adresi</label>
                    <input type="text" id="m3uUrl" placeholder="https://example.com">
                </div>
                <button class="btn-blue" onclick="loadM3U()">Kanalları Yükle</button>
            </div>

            <!-- Xtream Form -->
            <div class="card">
                <h2 style="color: var(--accent-green);">🔐 Xtream API</h2>
                <div class="form-group">
                    <label>Sunucu URL (Host)</label>
                    <input type="text" id="xtreamHost" placeholder="http://sunucuadresi.com:8080">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="xtreamUser" placeholder="Kullanıcı adı">
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="xtreamPass" placeholder="Şifre">
                    </div>
                </div>
                <button class="btn-green" onclick="loadXtream()">Giriş Yap ve Yükle</button>
            </div>
        </div>

        <!-- Bildirim Alanı -->
        <div id="statusBar" class="status-bar"></div>

        <!-- İzleme Alanı -->
        <div class="main-grid">
            <!-- Sol Oynatıcı -->
            <div class="player-wrapper">
                <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                    <p class="vjs-no-js">Lütfen tarayıcınızda JavaScript'i aktifleştirin.</p>
                </video>
                <div class="track-info" id="currentTrack">
