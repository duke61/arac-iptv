<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Media IPTV Player</title>
    <style>
        /* TAMAMEN STATİK VE KIRILMAZ PREMIUM ARABİRİM TASARIMI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 22px;
            color: #3b82f6;
            font-weight: 700;
        }

        .grid-forms {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .grid-forms { grid-template-columns: 1fr 1fr; }
        }

        .config-card {
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 10px;
            padding: 20px;
        }

        .config-card h2 {
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .m3u-color { color: #3b82f6; }
        .xtream-color { color: #10b981; }

        .input-item {
            margin-bottom: 10px;
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background-color: #090d16;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: white;
            margin-top: 5px;
        }

        .action-blue { background-color: #2563eb; }
        .action-blue:hover { background-color: #1d4ed8; }
        .action-green { background-color: #059669; }
        .action-green:hover { background-color: #047857; }

        .status-badge {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: block;
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            color: #94a3b8;
        }

        .panel-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 1024px) {
            .panel-layout { grid-template-columns: 1.8fr 1.2fr; }
        }

        .media-box {
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #243552;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .media-title {
            background-color: #151f32;
            padding: 12px;
            font-size: 14px;
            border-top: 1px solid #243552;
        }

        .sidebar {
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 10px;
            padding: 15px;
            height: 450px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge-info {
            background-color: #243552;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: #cbd5e1;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .row-channel {
            width: 100%;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-channel:hover {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #fff;
        }

        .row-channel.selected {
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
        }

        .blank-text {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚗 Auto Media IPTV Player</h1>
        </header>

        <div class="grid-forms">
            <div class="config-card">
                <h2 class="m3u-color">🔗 M3U Playlist Girişi</h2>
                <div class="input-item">
                    <label>M3U URL</label>
                    <input type="text" id="m3uUrlBox" placeholder="https://site.com">
                </div>
                <button class="action-blue" id="btnM3u" onclick="startM3ULoad()">Kanalları Yükle</button>
            </div>

            <div class="config-card">
                <h2 class="xtream-color">🔐 Xtream API Hızlı Giriş</h2>
                <div class="input-item">
                    <label>Sunucu Adresi (Host)</label>
                    <input type="text" id="xtreamHostBox" placeholder="http://sunucuadresi.com:8080">
                </div>
                <div class="row-inputs">
                    <div class="input-item">
                        <label>Kullanıcı</label>
                        <input type="text" id="xtreamUserBox" placeholder="Username">
                    </div>
                    <div class="input-item">
                        <label>Şifre</label>
                        <input type="password" id="xtreamPassBox" placeholder="Password">
                    </div>
                </div>
                <button class="action-green" id="btnXtream" onclick="startXtreamLoad()">Yükle</button>
            </div>
        </div>

        <div id="statusAlert" class="status-badge">Sistem Hazır. Bilgilerinizi girip butona basın.</div>

        <div class="panel-layout">
            <div class="media-box">
                <video id="carVideoView" controls autoplay></video>
                <div class="media-title" id="lblPlaying">
                    Kanal: <span style="color: #60a5fa;">Seçilmedi</span>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-top">
                    <h3>Kanallar</h3>
                    <span class="badge-info" id="lblTotal">0 Kanal</span>
                </div>
                <input type="text" id="txtSearch" oninput="runSearch()" placeholder="Kanal ismi ara...">
                <div class="channels-list" id="domChannelList">
                    <div class="blank-text">Kanallar burada listelenecek.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var loadedChannels = [];
        var mainVideo = document.getElementById('carVideoView');

        function printStatus(msg, mode) {
            var el = document.getElementById('statusAlert');
            el.innerText = msg;
            if (mode === 'err') {
                el.style.borderColor = '#ef4444';
                el.style.color = '#fca5a5';
                el.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
            } else if (mode === 'ok') {
                el.style.borderColor = '#10b981';
                el.style.color = '#a7f3d0';
                el.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
            } else {
                el.style.borderColor = '#3b82f6';
                el.style.color = '#93c5fd';
                el.style.backgroundColor = 'rgba(59, 130, 246, 0.15)';
            }
        }

        function startM3ULoad() {
            var rawUrl = document.getElementById('m3uUrlBox').value.trim();
            if (!rawUrl) {
                alert('Lütfen linkinizi yazın.');
                return;
            }

            printStatus('Güvenli bağlantı tüneli kuruluyor, lütfen bekleyin...', 'wait');

            // URL içindeki tüm tehlikeli karakterleri tarayıcı filtresinden gizler
            var cleanUrl = encodeURIComponent(rawUrl);
            var gateway = 'https://allorigins.win' + cleanUrl;

            // Arka plandaki tüm kilitlenmeleri aşan izole istek mimarisi
            fetch(gateway)
                .then(function(res) { 
                    if (!res.ok) throw new Error('Ağ hatası');
                    return res.json(); 
                })
                .then(function(json) {
                    if (json && json.contents && json.contents.trim().length > 0) {
                        buildList(json.contents);
                    } else {
