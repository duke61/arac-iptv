<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Web IPTV Player</title>
    <style>
        /* SIFIR BAĞIMLILIKLI PREMIUM CSS TASARIMI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 26px;
            color: #3b82f6;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Giriş Panelleri */
        .forms-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .forms-grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .m3u-title { color: #60a5fa; }
        .xtream-title { color: #34d399; }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 11px;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: white;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        .btn-blue { background-color: #2563eb; }
        .btn-blue:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #059669; }
        .btn-green:hover { background-color: #047857; }

        /* Durum Bildirim Çubuğu */
        .status-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
            background-color: #1e293b;
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }

        /* Oynatıcı Düzeni */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .main-layout { grid-template-columns: 2fr 1fr; }
        }

        .player-container {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .player-footer {
            background-color: #1e293b;
            padding: 15px;
            font-size: 14px;
            border-top: 1px solid #334155;
            font-weight: 500;
        }

        /* Sağ Liste Paneli */
        .sidebar {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            height: 520px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .count-badge {
            background-color: #334155;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .list-scroller {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-btn {
            width: 100%;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            padding: 11px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .channel-btn:hover {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #fff;
        }

        .channel-btn.active {
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
            border-color: #60a5fa;
        }

        .no-data {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📺 Premium Web IPTV Player</h1>
            <p>M3U linkinizi veya Xtream hesap bilgilerinizi girerek anında izleyin.</p>
        </header>

        <!-- Giriş Bölümleri -->
        <div class="forms-grid">
            <!-- M3U Form -->
            <div class="card">
                <h2 class="m3u-title">🔗 M3U / M3U8 Playlist</h2>
                <div class="form-group">
                    <label>Oynatma Listesi URL Adresi</label>
                    <input type="text" id="inputM3u" placeholder="https://site.com">
                </div>
                <button class="btn-blue" onclick="handleM3U()">Kanalları Yükle</button>
            </div>

            <!-- Xtream Form -->
            <div class="card">
                <h2 class="xtream-title">🔐 Xtream API Girişi</h2>
                <div class="form-group">
                    <label>Sunucu URL (Host)</label>
                    <input type="text" id="inputHost" placeholder="http://sunucuadresi.com:8080">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="inputUser" placeholder="Username">
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="inputPass" placeholder="Password">
                    </div>
                </div>
                <button class="btn-green" onclick="handleXtream()">Giriş Yap ve Yükle</button>
            </div>
        </div>

        <!-- Durum Bildirimi -->
        <div id="statusNotification" class="status-box"></div>

        <!-- Ana Düzen -->
        <div class="main-layout">
            <!-- Sol Video Oynatıcı -->
            <div class="player-container">
                <video id="webPlayer" controls autoplay></video>
                <div class="player-footer" id="nowPlaying">
                    Oynatılan Kanal: <span style="color: #60a5fa;">Henüz Seçilmedi</span>
                </div>
            </div>

            <!-- Sağ Kanal Listesi -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>Kanal Listesi</h3>
                    <span class="count-badge" id="totalChannels">0 Kanal</span>
                </div>
                <input type="text" id="searchBar" oninput="searchChannels()" placeholder="Kanal adı ile ara...">
                <div class="list-scroller" id="boxChannels">
                    <div class="no-data">Lütfen listenizi yukarıdan yükleyin.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalChannels = [];
        const videoElement = document.getElementById('webPlayer');

        function updateStatus(text, isError) {
            const box = document.getElementById('statusNotification');
            box.innerText = text;
            box.style.display = 'block';
            if (isError) {
                box.style.borderColor = '#ef4444';
                box.style.color = '#fca5a5';
                box.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            } else {
                box.style.borderColor = '#3b82f6';
                box.style.color = '#93c5fd';
                box.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
            }
        }

        // M3U Verisini İndirme Fonksiyonu
        async function handleM3U() {
