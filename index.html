<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Araç Web IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset {
            background-color: #333;
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .login-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 90%;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background-color: #2a2a2a;
            border: none;
            color: var(--text-color);
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .app-container {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        @media (min-width: 850px) {
            .app-container {
                flex-direction: row;
                height: calc(100vh - 60px);
            }
        }

        .player-section {
            flex: 2;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 250px;
        }

        video {
            width: 100%;
            max-height: 70vh;
            outline: none;
        }

        .playlist-section {
            flex: 1;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            max-height: 500px;
        }

        @media (min-width: 850px) {
            .playlist-section {
                max-height: 100%;
            }
        }

        .search-box {
            padding: 12px;
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .channel-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .channel-item:active, .channel-item.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .loading-spinner {
            display: none;
            color: #ffcc00;
            font-size: 1rem;
            text-align: center;
            padding: 15px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 Auto IPTV</h1>
        <button class="btn-reset hidden" id="resetBtn" onclick="logout()">Çıkış Yap</button>
    </header>

    <div class="login-container" id="loginScreen">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('m3u')">M3U Linki</button>
            <button class="tab-btn" onclick="switchTab('xtream')">Xtream API</button>
        </div>

        <form id="m3uForm" onsubmit="handleM3uSubmit(event)">
            <div class="form-group">
                <label for="m3uUrl">M3U / M3U8 Playlist URL Adresi</label>
                <input type="url" id="m3uUrl" placeholder="http://sunucu.com/get.php?..." required>
            </div>
            <button type="submit" class="btn-submit">Kanalları Yükle</button>
        </form>

        <form id="xtreamForm" class="hidden" onsubmit="handleXtreamSubmit(event)">
            <div class="form-group">
                <label for="xtreamHost">Sunucu URL (Host)</label>
                <input type="text" id="xtreamHost" placeholder="http://sunucu.com:8080" required>
            </div>
            <div class="form-group">
                <label for="xtreamUser">Kullanıcı Adı</label>
                <input type="text" id="xtreamUser" placeholder="Kullanıcı Adı" required>
            </div>
            <div class="form-group">
                <label for="xtreamPass">Şifre</label>
                <input type="password" id="xtreamPass" placeholder="Şifre" required>
            </div>
            <button type="submit" class="btn-submit">Giriş Yap ve Yükle</button>
        </form>

        <div id="loadingText" class="loading-spinner">Listeler çekiliyor, lütfen bekleyin...</div>
    </div>

    <div class="app-container" id="appScreen">
        <div class="player-section">
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
        <div class="playlist-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Kanal Ara..." oninput="filterChannels()">
            </div>
            <ul class="channel-list" id="channelList"></ul>
        </div>
    </div>

    <script>
        let channels = [];
        let hls = null;

        window.onload = () => {
            const savedUrl = localStorage.getItem('iptv_m3u_url');
            if (savedUrl) {
                loadPlaylist(savedUrl);
            }
        };

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'm3u') {
                tabs[0].classList.add('active');
                document.getElementById('m3uForm').classList.remove('hidden');
                document.getElementById('xtreamForm').classList.add('hidden');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('m3uForm').classList.add('hidden');
                document.getElementById('xtreamForm').classList.remove('hidden');
            }
        }

        function handleM3uSubmit(e) {
            e.preventDefault();
            const url = document.getElementById('m3uUrl').value.trim();
            if (url) {
                localStorage.setItem('iptv_m3u_url', url);
                loadPlaylist(url);
            }
        }

        function handleXtreamSubmit(e) {
            e.preventDefault();
            let host = document.getElementById('xtreamHost').value.trim();
            const user = document.getElementById('xtreamUser').value.trim();
            const pass = document.getElementById('xtreamPass').value.trim();

            if (!host.startsWith('http://') && !host.startsWith('https://')) {
                host = 'http://' + host;
            }
            if (host.endsWith('/')) {
                host = host.slice(0, -1);
            }

            const m3uUrl = `${host}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=ts`;
            localStorage.setItem('iptv_m3u_url', m3uUrl);
            loadPlaylist(m3uUrl);
        }

        function fetchPlaylist(targetUrl) {
            return new Promise((resolve, reject) => {
                // Her ihtimale karşı Yandex ve Cloudflare CORS proxy servisi üzerinden çek
                const proxyUrl = `https://cors-anywhere.herokuapp.com/${targetUrl}`;
                const fallbackProxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

                fetch(fallbackProxy)
                    .then(res => {
                        if (!res.ok) throw new Error("Yayın listesi çekilemedi.");
                        return res.text();
                    })
                    .then(data => resolve(data))
                    .catch(() => {
                        // İkinci proxy denemesi
                        fetch(proxyUrl)
                            .then(res => res.text())
                            .then(data => resolve(data))
                            .catch(err => reject(err));
                    });
            });
        }

        async function loadPlaylist(url) {
            showLoading(true);
            try {
                const text = await fetchPlaylist(url);
                parseM3U(text);

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('resetBtn').classList.remove('hidden');
            } catch (err) {
                alert("Yayın listesi yüklenemedi!\n\nLütfen girdiğiniz bilgileri (Kullanıcı Adı/Şifre/Host) kontrol edin veya tarayıcıda güvensiz içeriklere izin verildiğinden emin olun.");
            } finally {
                showLoading(false);
            }
        }

        function parseM3U(content) {
            channels = [];
            const lines = content.split('\n');
            let currentName = '';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    currentName = nameParts[nameParts.length - 1].trim();
                } else if (line.length > 0 && !line.startsWith('#')) {
                    if (currentName) {
                        channels.push({ name: currentName, url: line });
                        currentName = '';
                    }
                }
            }
            renderChannels(channels);
        }

        function renderChannels(items) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            if (items.length === 0) {
                listEl.innerHTML = '<li class="channel-item">Kanal bulunamadı.</li>';
                return;
            }

            items.forEach((ch) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerText = ch.name;
                li.onclick = () => playChannel(ch.url, li);
                listEl.appendChild(li);
            });
        }

        function playChannel(url, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            const video = document.getElementById('videoPlayer');

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                alert('Tarayıcınız bu video formatını desteklemiyor.');
            }
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function showLoading(show) {
            document.getElementById('loadingText').style.display = show ? 'block' : 'none';
        }

        function logout() {
            localStorage.removeItem('iptv_m3u_url');
            if (hls) hls.destroy();
            location.reload();
        }
    </script>
</body>
</html>
