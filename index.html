<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player</title>
    <!-- Tailwind CSS (Arayüz tasarımı için) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Video.js (HLS/M3U8 oynatabilen modern video oynatıcı) -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>
    <style>
        .video-js { width: 100% !important; height: 500px !important; }
        @media (max-width: 768px) { .video-js { height: 250px !important; } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-6xl">
        <header class="text-center my-6">
            <h1 class="text-3xl font-bold text-blue-500">📺 Web IPTV Player</h1>
            <p class="text-gray-400 text-sm mt-1">Xtream API veya M3U ile anında izleyin</p>
        </header>

        <!-- GİRİŞ FORMLARI -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <!-- M3U Girişi -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-blue-400">🔗 M3U / M3U8 Oynatma Listesi</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">M3U Playlist URL</label>
                        <input type="text" id="m3uUrl" placeholder="https://example.com" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <button onclick="loadM3U()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded text-sm transition">Kanalları Yükle</button>
                </div>
            </div>

            <!-- Xtream API Girişi -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-emerald-400">🔐 Xtream API Girişi</h2>
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Sunucu URL (Host)</label>
                        <input type="text" id="xtreamHost" placeholder="http://sunucuadresi.com:8080" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Kullanıcı Adı</label>
                            <input type="text" id="xtreamUser" placeholder="Username" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Şifre</label>
                            <input type="password" id="xtreamPass" placeholder="Password" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                    <button onclick="loadXtream()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2 rounded text-sm transition mt-1">Giriş Yap ve Yükle</button>
                </div>
            </div>

        </div>

        <!-- DURUM VE OYNATICI ALANI -->
        <div id="statusMessage" class="hidden text-center p-3 my-4 bg-yellow-900/50 text-yellow-300 border border-yellow-700 rounded text-sm"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Video Oynatıcı -->
            <div class="lg:col-span-2 bg-black rounded-lg overflow-hidden shadow-2xl flex flex-col justify-center">
                <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup="{}">
                    <p class="vjs-no-js">Video oynatmak için JavaScript'i etkinleştirmeniz gerekir.</p>
                </video>
                <div id="currentTrack" class="bg-gray-800 p-3 text-sm font-medium border-t border-gray-700 text-gray-300">
                    Oynatılan Kanal: <span class="text-blue-400">Henüz kanal seçilmedi</span>
                </div>
            </div>

            <!-- Kanal Listesi -->
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 h-[550px] flex flex-col">
                <h3 class="text-lg font-semibold mb-2 flex justify-between items-center text-gray-300">
                    <span>📺 Kanal Listesi</span>
                    <span id="channelCount" class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-400">0 Kanal</span>
                </h3>
                <input type="text" id="searchChannel" oninput="filterChannels()" placeholder="Kanal ara..." class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm mb-3 focus:outline-none">
                
                <div id="channelList" class="overflow-y-auto flex-1 space-y-1 pr-1 text-sm scrollbar-thin scrollbar-thumb-gray-600">
                    <p class="text-gray-500 text-center mt-10">Lütfen yukarıdan listenizi yükleyin.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allChannels = [];
        let player = videojs('my-video');

        function showStatus(msg, isError = false) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerText = msg;
            statusEl.className = `text-center p-3 my-4 rounded text-sm ${isError ? 'bg-red-900/50 text-red-300 border border-red-700' : 'bg-blue-900/50 text-blue-300 border border-blue-700'}`;
            statusEl.classList.remove('hidden');
        }

        // M3U Yükleme Fonksiyonu
        async function loadM3U() {
            const url = document.getElementById('m3uUrl').value.trim();
            if (!url) return alert('Lütfen geçerli bir M3U linki girin!');
            
            showStatus('Oynatma listesi yükleniyor, lütfen bekleyin...');
            
            try {
                // CORS engeline takılmamak için proxy kullanma ihtimaline karşın doğrudan fetch denenir
                const response = await fetch(url);
                if (!response.ok) throw new Error('Ağ yanıtı düzgün değil.');
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                console.error(error);
                showStatus('Doğrudan erişim engellendi (CORS). Herkese açık bir CORS proxy kullanılarak tekrar deneniyor...');
                try {
                    const proxyUrl = `https://allorigins.win{encodeURIComponent(url)}`;
                    const proxyResp = await fetch(proxyUrl);
                    const proxyData = await proxyResp.json();
                    parseM3U(proxyData.contents);
                } catch (proxyError) {
                    showStatus('Kanal listesi yüklenemedi. Linkin doğruluğundan veya CORS izinlerinden emin olun.', true);
                }
            }
        }

        // M3U Ayrıştırıcı (Basit)
        function parseM3U(data) {
            allChannels = [];
            const lines = data.split('\n');
            let currentName = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    // Kanal ismini yakala
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1] || 'Bilinmeyen Kanal';
                } else if (line && !line.startsWith('#')) {
                    if (currentName) {
                        allChannels.push({ name: currentName, url: line });
                        currentName = '';
                    }
                }
            }
            renderChannels();
        }

        // Xtream API Yükleme Fonksiyonu
        async function loadXtream() {
            let host = document.getElementById('xtreamHost').value.trim();
            const user = document.getElementById('xtreamUser').value.trim();
            const pass = document.getElementById('xtreamPass').value.trim();

            if (!host || !user || !pass) return alert('Lütfen tüm Xtream bilgilerini doldurun!');
            if (!host.startsWith('http')) host = 'http://' + host;

            showStatus('Xtream API bağlantısı kuruluyor...');
            
            // Xtream formatında canlı yayınların m3u çıktısını alma URL'i
            const xtreamM3uUrl = `${host}/get.php?username=${user}&password=${pass}&output=ts`;
            
            // Üretilen linki M3U yükleyiciye pasla
            document.getElementById('m3uUrl').value = xtreamM3uUrl;
            loadM3U();
        }

        // Kanalları Arayüze Çizdirme
        function renderChannels(channelsToRender = allChannels) {
            const listEl = document.getElementById('channelList');
            const countEl = document.getElementById('channelCount');
            listEl.innerHTML = '';
            
            countEl.innerText = `${channelsToRender.length} Kanal`;

            if (channelsToRender.length === 0) {
                listEl.innerHTML = '<p class="text-gray-500 text-center mt-10">Kanal bulunamadı.</p>';
                return;
            }

            document.getElementById('statusMessage').classList.add('hidden');

            channelsToRender.forEach(channel => {
                const btn = document.createElement('button');
